<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,nofollow">
    <title>Wordfeud Analyzer — inloggen</title>
    <link rel="stylesheet" href="/feutsolver-login.css">
  </head>
  <body>
    <main>
      <h1>Wordfeud Analyzer</h1>
      <p>Log in om de solver te gebruiken. Sessiegegevens blijven beperkt geldig.</p>
      <form method="post" action="/feutsolver-login-submit" autocomplete="on">
        <label>Gebruikersnaam <input name="httpd_username" autocomplete="username" required autofocus></label>
        <label>Wachtwoord <input type="password" name="httpd_password" autocomplete="current-password" required></label>
        <button type="submit">Inloggen</button>
      </form>
    </main>
  </body>
</html>
