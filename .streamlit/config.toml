[server]
# Apache is the only public listener; block TCP/8501 at the host firewall too.
address = "127.0.0.1"
port = 8501
# The server rejects oversized files before they consume app memory.
maxUploadSize = 2
maxMessageSize = 5
# Streamlit drops the board and the suggestions of every session whose
# websocket stays disconnected longer than this; a locked phone must not cost
# a running game. After a longer break the browser restores its own board.
disconnectedSessionTTL = 7200
# Production releases are activated atomically and restarted by
# feutsolver.path. Polling this immutable checkout consumes CPU without serving
# users, especially on the single-vCPU VPS.
runOnSave = false
fileWatcherType = "none"
